<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients || Cardiac Patient Monitoring System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
    <style>
        .cairo {
            font-family: "Cairo", sans-serif;
        }
    </style>
</head>
<body class="cairo bg-[#fcfbf9] text-slate-800">
    <div class="min-h-screen flex flex-col lg:flex-row">
        <!-- Sidebar Container -->
        <div id="navbar"></div>
        <div class="flex-1 flex flex-col">

            <!-- Header Container -->
            <div id="header"></div>

            <main class="flex-1 p-4 sm:p-8">

                <section>>
                    <div class="mb-6">
                        <span class="text-sm font-semibold text-teal-700">Specialized Heart Hospital</span>
                        <h1 class="text-3xl font-extrabold text-slate-900 mt-1">Patients</h1>
                        <p class="text-sm text-gray-500 mt-1">
                            Search, filter, and view patient medical details.
                        </p>
                    </div>

                    <!-- Search and Filter Card -->
                    <div class="mb-6 rounded-2xl bg-white p-5 shadow-sm border border-slate-100">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                            <!-- Filter by Condition (Left/Smaller side) -->
                            <div class="md:col-span-1">
                                <label class="mb-1 block text-xs font-semibold text-slate-600">
                                    Filter by Condition
                                </label>
                                <select id="conditionFilter"
                                    class="w-full rounded-xl border border-slate-200 p-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500 bg-slate-50/50">
                                    <option value="All">All Conditions</option>
                                    <option value="Stable">Stable</option>
                                    <option value="Needs Follow-up">Needs Follow-up</option>
                                    <option value="Critical">Critical</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="mb-1 block text-xs font-semibold text-slate-600">
                                    Search Patient
                                </label>
                                <div class="relative">
                                    <input type="text" id="patientSearch" placeholder="Search by patient name"
                                        class="w-full rounded-xl border border-slate-200 p-2.5 pl-9 text-sm outline-none focus:ring-2 focus:ring-teal-500 bg-slate-50/50">
                                    <i
                                        class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Patients Table Block -->
                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-slate-50/80 border-b border-slate-200 text-slate-600">
                                    <tr>
                                        <th class="px-6 py-4 font-bold whitespace-nowrap">Name</th>
                                        <th class="px-6 py-4 font-bold whitespace-nowrap">Age</th>
                                        <th class="px-6 py-4 font-bold whitespace-nowrap">Gender</th>
                                        <th class="px-6 py-4 font-bold whitespace-nowrap">Phone</th>
                                        <th class="px-6 py-4 font-bold whitespace-nowrap">Blood Type</th>
                                        <th class="px-6 py-4 font-bold whitespace-nowrap">Condition</th>
                                        <th class="px-6 py-4 font-bold whitespace-nowrap text-center">Action</th>
                                    </tr>
                                </thead>

                                <tbody id="patients-table-body" class="divide-y divide-slate-100">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </main>
            <div id="footer"></div>
        </div>
    </div>
    <script src="../JS/components.js"></script>
    <script src="../JS/patients.js"></script>
</body>
</html>
