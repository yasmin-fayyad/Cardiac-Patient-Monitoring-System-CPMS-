
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitals || Cardiac Patient Monitoring System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
    <style>
        .cairo {
            font-family: "Cairo", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>

<body class="cairo bg-[#fcfbf9] text-gray-800">
    <div class="min-h-screen flex flex-col lg:flex-row">
        <div id="navbar"></div>

        <div class="flex-1 flex flex-col">
            <div id="header"></div>

            <main class="flex-1 p-4 sm:p-8">
                <!-- Header Actions -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
                    <div>
                        <h1 class="text-2xl font-bold">Cardiac Vitals</h1>
                        <p class="text-sm text-gray-500 mt-2">Latest vital sign readings for all registered patients</p>
                    </div>
                </div>

                <!-- Vitals Table -->
                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 font-semibold text-gray-600 text-sm whitespace-nowrap">Patient Name</th>
                                    <th class="px-6 py-4 font-semibold text-gray-600 text-sm whitespace-nowrap">Patient Age</th>
                                    <th class="px-6 py-4 font-semibold text-gray-600 text-sm whitespace-nowrap">Heart Rate</th>
                                    <th class="px-6 py-4 font-semibold text-gray-600 text-sm whitespace-nowrap">Blood Pressure</th>
                                    <th class="px-6 py-4 font-semibold text-gray-600 text-sm whitespace-nowrap">Oxygen Level</th>
                                </tr>
                            </thead>
                            <tbody id="vitals-table-body" class="divide-y divide-gray-100">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../JS/components.js"></script>
    <script src="../JS/vital.js"></script>
</body>
</html>
